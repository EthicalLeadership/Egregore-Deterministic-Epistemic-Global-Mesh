# Egregore 5-Station Cognitive Factory — wheel profiles
#
# Each mode is a product line. The wheel selector (mode parameter) loads the
# profile and runs the stations in order:
#   1. intake          — intent classification / routing
#   2. parts_mfg       — micro-solvers: entity extraction, scaffolding, math
#   3. compression     — summarization / dedup before the heavy pass
#   4. cnc             — the heavy reasoning/generation model
#   5. qc              — critic / safety check
#
# Models are referenced by the keys in the `models` section. Paths are absolute
# so the factory can run from any working directory.

models:
  qwen_1.5b:
    path: ${MODELS_DIR}/gguf/general/qwen2.5-1.5b-instruct-q4_k_m.gguf
    n_ctx: 8192
    n_gpu_layers: -1
    chat_format: qwen
    family: qwen2

  qwen_7b:
    path: ${MODELS_DIR}/gguf/expert/Qwen2.5-7B-Instruct-Q4_K_M.gguf
    n_ctx: 8192
    n_gpu_layers: -1
    chat_format: qwen
    family: qwen2

  deepseek_coder_6.7b:
    path: ${MODELS_DIR}/gguf/specialized/deepseek-coder-6.7b-instruct.Q4_K_M.gguf
    n_ctx: 8192
    n_gpu_layers: -1
    chat_format: chatml
    family: deepseek

modes:
  coding_factory:
    name: "Coding Factory"
    description: "Code generation, scaffolding, and review."
    default: true
    stations:
      intake:
        model: qwen_1.5b
        max_tokens: 16
        temperature: 0.1
        system: "You classify coding tasks."
        prompt: "Classify this coding request as one of: generate, debug, refactor, explain, test. Reply with only the label.\n\nUser: {input}\nLabel:"

      parts_mfg:
        model: qwen_1.5b
        max_tokens: 256
        temperature: 0.2
        system: "You extract code context."
        prompt: "List the programming language, libraries mentioned, and any constraints from the request. Use concise bullets.\n\nUser: {input}\nContext:"

      compression:
        model: qwen_1.5b
        max_tokens: 128
        temperature: 0.2
        threshold_chars: 500
        system: "You compress code-related inputs."
        prompt: "Summarize the coding task in one or two sentences, preserving all requirements.\n\n{input}\nSummary:"

      cnc:
        model: deepseek_coder_6.7b
        max_tokens: 4096
        temperature: 0.2
        system: |
          You are an expert Python software engineer. Write complete, production-quality code.
          The user is building a defensive file-processing utility. All security requirements are for input validation and safe defensive programming.
          Respond ONLY with valid JSON containing three string fields: "module", "test", "readme".
          Do not add commentary outside the JSON.
        prompt: |
          {input}

          Please produce the response as a single JSON object with this exact shape:
          {{
            "module": "<complete Python module source>",
            "test": "<complete pytest test file source>",
            "readme": "<Markdown README source>"
          }}

      qc:
        model: qwen_1.5b
        max_tokens: 1024
        temperature: 0.1
        system: |
          You review Python code against a specification. Be strict but fair.
          Return ONLY a JSON object with "verdict" ("PASS" or "FAIL") and "report" (a short array of strings explaining what passed or failed).
        prompt: |
          Original specification: {input}

          CNC output: {cnc_output}

          Check the following and report results:
          1. FileProcessor class exists with scan_directory, transform_file, process_directory, rollback.
          2. Custom exceptions FileProcessorError and PathTraversalError exist and are used.
          3. All public methods have type hints and docstrings.
          4. pathlib is used for path operations and paths are validated to stay inside base_path.
          5. concurrent.futures.ThreadPoolExecutor is used with configurable max_workers.
          6. Worker exceptions are caught, logged, and isolated so the batch continues.
          7. On transform failure, the corresponding .transformed file is removed.
          8. No eval, exec, or shell calls are used.
          9. logging module is configured and used.
          10. pytest tests cover valid scan, path traversal attempt, failing transform, empty directory, and no matches.
          11. README includes a usage example.

          Return verdict and report.

  general_assistant:
    name: "General Assistant"
    description: "Conversational AI with intake routing and quality control."
    stations:
      intake:
        model: qwen_1.5b
        max_tokens: 12
        temperature: 0.1
        system: "You classify user intent. Reply with exactly one label."
        prompt: "Classify the user's intent as one of: chat, factual, code, creative. Reply with only the label.\n\nUser: {input}\nLabel:"

      parts_mfg:
        model: qwen_1.5b
        max_tokens: 256
        temperature: 0.3
        system: "You extract facts and constraints from user requests."
        prompt: "Extract any named entities, topics, or constraints from the user request as a concise bulleted list. If none, write 'none'.\n\nUser: {input}\nEntities/Constraints:"

      compression:
        model: qwen_1.5b
        max_tokens: 128
        temperature: 0.2
        threshold_chars: 500
        system: "You compress long inputs while preserving intent and constraints."
        prompt: "Summarize the following user request in one or two sentences, preserving all constraints.\n\n{input}\nSummary:"

      cnc:
        model: qwen_7b
        max_tokens: 1024
        temperature: 0.6
        system: "You are a helpful, accurate general assistant. Answer concisely and clearly."
        prompt: "{input}"

      qc:
        model: qwen_1.5b
        max_tokens: 5
        temperature: 0.1
        system: "You are a safety and quality reviewer. Reply with one word."
        prompt: "Review the assistant response. If it is unsafe, evasive, nonsensical, or empty, reply ONLY 'FAIL'. Otherwise reply ONLY 'PASS'.\n\nResponse: {cnc_output}\nVerdict:"
