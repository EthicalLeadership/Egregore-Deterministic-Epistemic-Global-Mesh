# ANCHORUM external tool registry.
# Mounted at GET /api/v1/anchorum/tools and rendered in the Dossiers tab.
# kind: local_exec | url
# target: executable path (local_exec) or URL (url)

tools:
  - id: red-dart
    name: Red Dart
    description: Deterministic email intake, classification, provenance, and governance pipeline.
    kind: python_script
    target: scripts/red_dart_launcher.py
    enabled: true

  - id: ocint
    name: OCINT
    description: Open-source intelligence module (placeholder).
    kind: url
    target: http://localhost:9999
    enabled: false
