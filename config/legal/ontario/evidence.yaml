rules:
  - domain: "Ontario evidence law"
    source: "Common law and rules of evidence"
    title: "Admissibility of Observations of Impairment"
    rule_text: |
      To prove a therapist was drinking beer during a review, admissible evidence may include direct testimony from witnesses, contemporaneous notes, admissions, or video/photo evidence. Hearsay, unless within an exception, is not admissible. The evidence must be relevant and reliable. A disciplinary body may admit evidence that would not be admissible in court.
