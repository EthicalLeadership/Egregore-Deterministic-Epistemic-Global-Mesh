rules:
- id: O1
  article: 5(1)
  title: Employment discrimination prohibited
  official_text: Every person has a right to equal treatment with respect to employment
    without discrimination because of race, ancestry, place of origin, colour, ethnic
    origin, citizenship, creed, sex, sexual orientation, gender identity, gender expression,
    age, record of offences, marital status, family status or disability.
  sha256: c0f697c24ff4183757e993a0e9232b1db84a17b40b22c5cb9f240d26bff84962
- id: O2
  article: 10(2)
  title: Pregnancy included in sex discrimination
  official_text: The right to equal treatment without discrimination because of sex
    includes the right to equal treatment without discrimination because a woman is
    or may become pregnant.
  sha256: de0eeb37f513e3b7bb27f6bffce322a3038ecf0f042d5748f8dd14948000b833
