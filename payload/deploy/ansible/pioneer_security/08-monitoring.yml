---
- name: Phase 08 | Deploy Node Exporter with mTLS on All Nodes
  hosts: pioneer
  become: true

  tasks:
    - name: Ensure runtime dependencies are installed
      ansible.builtin.apt:
        name:
          - curl
          - tar
        state: present
        update_cache: true

    - name: Create node_exporter system account
      ansible.builtin.user:
        name: nodeexp
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Download node_exporter release tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ node_exporter_sha256 }}"
        mode: "0644"

    - name: Extract node_exporter binary
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: restart node_exporter

    - name: Install node_exporter TLS web configuration
      ansible.builtin.template:
        src: templates/node_exporter_web_config.yml.j2
        dest: "{{ node_exporter_web_config }}"
        owner: root
        group: root
        mode: "0640"
      notify: restart node_exporter

    - name: Install node_exporter systemd unit
      ansible.builtin.template:
        src: templates/node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: restart node_exporter

    - name: Ensure node_exporter is enabled
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        enabled: true
        state: started

    - name: Allow node_exporter scrape port from LAN
      community.general.ufw:
        rule: allow
        src: "{{ pioneer_lan_cidr }}"
        port: "9100"
        proto: tcp
        comment: "Node exporter HTTPS from LAN"

  handlers:
    - name: restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        daemon_reload: true
        state: restarted

- name: Phase 08 | Provide Prometheus Secure Scrape Config Snippet
  hosts: pioneer-2
  become: true

  tasks:
    - name: Ensure Prometheus config drop-in directory exists
      ansible.builtin.file:
        path: /etc/prometheus/file_sd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy security-lane scrape configuration
      ansible.builtin.template:
        src: templates/prometheus-scrape-security.yml.j2
        dest: /etc/prometheus/file_sd/pioneer-node-exporter-security.yml
        owner: root
        group: root
        mode: "0644"
